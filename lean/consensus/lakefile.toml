name = "consensus"
version = "0.1.0"
moreLeanArgs = ["-DwarningAsError=true", "-Dtrace.Kernel=true"]
leanOptions = { autoImplicit = false }
builtinLint = true
# `consensus-reduction` and `consensus-midtrace` are not default targets: every executable
# defines `main`, so `lake check` of two in one environment fails. CI checks and builds
# each explicitly.
defaultTargets = ["Consensus", "consensus-replay", "MidTrace"]

[[require]]
name = "ccf_common"
path = "../common"
copy = false

[[require]]
name = "leanfmt"
git = "https://github.com/duckki/leanfmt.git"
rev = "65d69c8dc2dfd0aa69fd4132d48f38b7af9a57ef" # v0.4.5

[[lean_lib]]
name = "Consensus"

[[lean_exe]]
name = "consensus-replay"
srcDir = "replay"
root = "ReplayMain"

[[lean_lib]]
name = "MidTrace"
srcDir = "midtrace"

[[lean_exe]]
name = "consensus-reduction"
srcDir = "midtrace"
root = "ReductionMain"

[[lean_exe]]
name = "consensus-midtrace"
srcDir = "midtrace"
root = "MidTraceMain"
